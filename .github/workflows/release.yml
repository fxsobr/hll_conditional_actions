# Publishes the images a release is installed from.
#
# Pushing a `v*` tag builds both images and pushes them to GitHub's registry,
# so upgrading is a pull rather than a compile on the operator's machine:
#
#   git fetch --tags && git checkout v0.2.0
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
#
# The tag is what the image is named after, and it is baked into the app as
# BUILD_VERSION so the About dialog reports the release rather than guessing
# from mix.exs.
#
# Only linux/amd64 is published. Building an Elixir release for arm64 under
# emulation takes long enough to make cutting a release a chore, and the
# `build:` section in compose.prod.yaml is still there for anyone on another
# architecture — see the Upgrading page.
name: release

on:
  push:
    tags: ["v*"]
  # For re-publishing a tag whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: The tag matches the tree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # v0.1.2 shipped a compose file naming a Caddy image that was never
      # built, because only one of the two image lines had been bumped. The
      # pull request check reads them all now; this one runs where it counts,
      # at the moment the release is made.
      - name: The tag, mix.exs and every image line agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mix_version=$(grep -m1 'version: "' mix.exs | sed 's/.*version: "//; s/".*//')
          image_versions=$(grep -o 'APP_VERSION:-v[^}]*' compose.prod.yaml \
            | sed 's/APP_VERSION:-v//' | sort -u)
          echo "tag: $tag   mix.exs: $mix_version   images: $(echo $image_versions)"
          test "$(echo "$image_versions" | wc -l)" -eq 1 || {
            echo "::error::The image tags in compose.prod.yaml do not agree with each other."
            exit 1
          }
          test "$tag" = "v$mix_version" || {
            echo "::error::The tag is $tag but mix.exs says $mix_version."
            exit 1
          }
          test "v$image_versions" = "$tag" || {
            echo "::error::compose.prod.yaml names v$image_versions, not $tag."
            exit 1
          }

  publish:
    name: Publish ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      # One failing image should not leave the other unpublished without
      # saying so.
      fail-fast: false
      matrix:
        include:
          - name: app
            image: hll_conditional_actions
            context: .
            dockerfile: Dockerfile
            versioned: true
          # Caddy is built here too. It is not the stock image: it carries the
          # rate limiting module, so there is nothing on Docker Hub to pull.
          # It takes no BUILD_VERSION — passing one it does not declare would
          # warn on every release.
          - name: caddy
            image: hll_conditional_actions-caddy
            context: ./deploy/caddy
            dockerfile: ./deploy/caddy/Dockerfile
            versioned: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Work out the version
        id: version
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          # `latest` moves; the version tag never does, which is what makes
          # pinning a deployment to one mean something.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          build-args: ${{ matrix.versioned && format('BUILD_VERSION={0}', steps.version.outputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
