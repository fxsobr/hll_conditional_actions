# Production stack without a reverse proxy.
#
#   cp .env.example .env    # then fill in the required secrets
#   docker compose -f compose.prod.direct.yaml up -d --build
#
# Same release as `compose.prod.yaml`, minus Caddy: the app answers on
# ${APP_PORT} over **plain HTTP**, the way CRCON's own web container answers on
# 8010. Use this when something else on the machine already terminates TLS, or
# when the app is only reachable over a private network.
#
# What you give up, and it is worth being clear about it:
#
#   * **No TLS.** Passwords and session cookies travel in clear. On the open
#     internet that is not acceptable — put a proxy in front, or use
#     compose.prod.yaml, which gets a certificate by itself.
#   * **No rate limiting at the edge.** The app still counts sign in attempts
#     by address and by account, but nothing refuses a flood before it reaches
#     the BEAM.
#
# `BEHIND_PROXY=false` is what makes this work rather than merely start: it
# turns off the https redirect (which would loop forever with nothing in front)
# and the `secure` flag on the session cookie (which would stop the cookie
# being sent at all, so signing in would appear to succeed and then not).

name: hll-conditional-actions

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-hll_conditional_actions}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Never published. Nothing outside the compose network needs it.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PORT: 4000
      PHX_HOST: "${PHX_HOST:?set PHX_HOST in .env}"
      # Nothing is terminating TLS in front. See the note at the top.
      BEHIND_PROXY: "false"
      DATABASE_URL: "ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-hll_conditional_actions}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?generate one with mix phx.gen.secret}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?generate one with openssl rand -base64 32}"
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      ENGINE_ENABLED: ${ENGINE_ENABLED:-true}
      EXECUTION_RETENTION_DAYS: ${EXECUTION_RETENTION_DAYS:-30}
      POOL_SIZE: ${POOL_SIZE:-10}
    # CRCON usually runs on the same machine. From inside a container
    # `localhost` is the container itself, so the CRCON URL has to be either
    # the machine's LAN address or `host.docker.internal`. Docker Desktop
    # resolves that name by itself; on Linux this line is what makes it work.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-4000}:4000"
    command: >
      sh -c "/app/bin/migrate && /app/bin/server"
    healthcheck:
      test: ["CMD", "/app/bin/hll_conditional_actions", "rpc", "1 + 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  db_data:
