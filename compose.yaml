# Development stack.
#
#   docker compose up
#
# The app is served on http://localhost:4000 with code reloading. Copy
# `.env.example` to `.env` first; every value there has a working default for
# local use.
#
# Production lives in `compose.prod.yaml`.

name: hll-conditional-actions-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-hll_conditional_actions_dev}
    ports:
      # Exposed so you can point a SQL client at it. Change the host side if
      # 5432 is already taken by another Postgres.
      #
      # These are DEV_* on purpose: a `.env` filled in for a deployment must
      # not change the credentials this database was created with.
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: dev
      PORT: 4000
      # Inside the compose network the database is reachable by service name.
      DATABASE_HOST: db
      DATABASE_USER: ${DEV_POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${DEV_POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${DEV_POSTGRES_DB:-hll_conditional_actions_dev}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      ENGINE_ENABLED: ${ENGINE_ENABLED:-true}
      # Binding to every interface is what makes the port reachable from the
      # host; outside Docker the dev server stays on loopback.
      DEV_BIND_ALL: "true"
      PHX_HOST: localhost
    # CRCON usually runs on the same machine. From inside a container
    # `localhost` is the container itself, so the CRCON URL has to be either
    # the machine's LAN address or `host.docker.internal`. Docker Desktop
    # resolves that name by itself; on Linux this line is what makes it work.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DEV_APP_PORT:-4000}:4000"
    volumes:
      - .:/app
      # Build artifacts stay in volumes: sharing them with the host would mix
      # Linux and host binaries, and is painfully slow on macOS and Windows.
      - build:/app/_build
      - deps:/app/deps
    command: >
      sh -c "mix deps.get &&
             mix ecto.setup &&
             mix phx.server"

volumes:
  db_data:
  build:
  deps:
