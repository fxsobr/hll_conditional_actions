# Production stack.
#
#   cp .env.example .env    # then fill in the required secrets
#   docker compose -f compose.prod.yaml up -d --build
#
# Caddy answers on APP_PORT (4000) over plain HTTP and leaves 80 and 443 alone,
# so this never gets in the way of CRCON or of anything else on the machine.
# See deploy/caddy/Caddyfile for what that means, and for putting TLS in front.
#
# Unlike the dev stack this builds the release image (`Dockerfile`), runs
# migrations before serving traffic, and refuses to start without its secrets.
#
# Only Caddy is published. The app and the database are reachable on the
# compose network and nowhere else, so the sign in form cannot be bypassed by
# talking to port 4000 directly.

name: hll-conditional-actions

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-hll_conditional_actions}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # The database is only reachable from the compose network; nothing outside
    # needs it, and not publishing a port is the cheapest way to keep it that
    # way.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PORT: 4000
      PHX_HOST: "${PHX_HOST:?set PHX_HOST in .env}"
      # Caddy is in front, so X-Forwarded-For can be believed; but it speaks
      # plain HTTP to the world, so there is no https to force and the session
      # cookie must not be marked `secure`. Set FORCE_HTTPS=true only once
      # something really is terminating TLS in front.
      BEHIND_PROXY: "true"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      PUBLIC_PORT: "${APP_PORT:-4000}"
      DATABASE_URL: "ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-hll_conditional_actions}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?generate one with openssl rand -base64 64}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?generate one with openssl rand -base64 32}"
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      ENGINE_ENABLED: ${ENGINE_ENABLED:-true}
      EXECUTION_RETENTION_DAYS: ${EXECUTION_RETENTION_DAYS:-30}
      POOL_SIZE: ${POOL_SIZE:-10}
    # CRCON usually runs on the same machine. From inside a container
    # `localhost` is the container itself, so the CRCON URL has to be either
    # the machine's LAN address or `host.docker.internal`. Docker Desktop
    # resolves that name by itself; on Linux this line is what makes it work.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Reachable from Caddy, never from the host.
    expose:
      - "4000"
    # Migrations run once, in the foreground, before the server starts. Doing
    # it here rather than at application boot keeps a half-migrated schema from
    # ever serving requests.
    command: >
      sh -c "/app/bin/migrate && /app/bin/server"
    healthcheck:
      test: ["CMD", "/app/bin/hll_conditional_actions", "rpc", "1 + 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  caddy:
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # `:4000` means plain HTTP on that port and no certificate. Set it to a
      # hostname, and publish 80 and 443 below, to have Caddy get one.
      SITE_ADDRESS: "${SITE_ADDRESS:-:4000}"
    ports:
      - "${APP_PORT:-4000}:4000"
      # For a deployment that sets SITE_ADDRESS to a hostname, swap the line
      # above for these:
      #   - "80:80"
      #   - "443:443"
      #   - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own state. Nothing precious while there is no certificate in
      # it, but it saves a warning on every boot.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  caddy_data:
  caddy_config:
